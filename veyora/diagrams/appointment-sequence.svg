<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" font-family="Manrope, system-ui, sans-serif">
  <rect width="1000" height="830" fill="#F7F8F5"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#182521">Appointment booking — sequence diagram</text>
  <style>
    .lh { fill:#FFFFFF; stroke:#096C60; }
    .lh-t { font-size:13px; font-weight:800; fill:#182521; text-anchor:middle; }
    .ll { stroke:#096C60; stroke-width:1.3; stroke-dasharray:4 5; }
    .msg { stroke:#182521; stroke-width:1.5; fill:none; marker-end:url(#seq); }
    .ret { stroke:#66756F; stroke-width:1.4; stroke-dasharray:6 4; fill:none; marker-end:url(#seq2); }
    .msg-t { font-size:11.5px; fill:#182521; font-weight:600; }
  </style>

  <rect x="80" y="58" width="170" height="38" rx="10" fill="#E8F1EC" stroke="#096C60"/>
  <text x="165" y="82" class="lh-t">Patient (browser)</text>
  <rect x="340" y="58" width="150" height="38" rx="10" class="lh"/>
  <text x="415" y="82" class="lh-t">React SPA</text>
  <rect x="580" y="58" width="150" height="38" rx="10" class="lh"/>
  <text x="655" y="82" class="lh-t">Flask API</text>
  <rect x="810" y="58" width="160" height="38" rx="10" class="lh"/>
  <text x="890" y="82" class="lh-t">SQLite (SQLAlchemy)</text>

  <line x1="165" y1="96" x2="165" y2="790" class="ll"/>
  <line x1="415" y1="96" x2="415" y2="790" class="ll"/>
  <line x1="655" y1="96" x2="655" y2="790" class="ll"/>
  <line x1="890" y1="96" x2="890" y2="790" class="ll"/>

  <path d="M165 130 H415" class="msg"/><text x="180" y="124" class="msg-t">1: sign in (email + password)</text>
  <path d="M415 160 H655" class="msg"/><text x="430" y="154" class="msg-t">2: POST /api/auth/login</text>
  <path d="M655 190 H890" class="msg"/><text x="670" y="184" class="msg-t">3: verify hash, create session, issue CSRF</text>
  <path d="M655 222 H415" class="ret"/><text x="430" y="216" class="msg-t" fill="#66756F">4: HttpOnly cookie + csrf_token</text>

  <path d="M415 262 H655" class="msg"/><text x="430" y="256" class="msg-t">5: GET /api/doctors · GET /api/doctors/:id/slots?date</text>
  <path d="M655 294 H415" class="ret"/><text x="430" y="288" class="msg-t" fill="#66756F">6: availability from roster + CONFIRMED rows (no patient identities)</text>

  <path d="M165 336 H415" class="msg"/><text x="180" y="330" class="msg-t">7: pick slot, confirm</text>
  <path d="M415 366 H655" class="msg"/><text x="430" y="360" class="msg-t">8: POST /api/appointments + X-CSRF-Token</text>
  <path d="M655 396 H890" class="msg"/><text x="670" y="390" class="msg-t">9: INSERT (transaction)</text>

  <rect x="330" y="420" width="620" height="210" fill="none" stroke="#6F5A1E" stroke-width="1.4"/>
  <rect x="330" y="420" width="190" height="26" fill="#F5EEDC" stroke="#6F5A1E" stroke-width="1.4"/>
  <text x="340" y="438" font-size="11.5" font-weight="800" fill="#6F5A1E">alt — slot free vs taken</text>

  <path d="M890 480 H415" class="ret"/><text x="430" y="474" class="msg-t" fill="#0B5D50">10a: commit → 201 CONFIRMED</text>
  <line x1="330" y1="510" x2="950" y2="510" stroke="#6F5A1E" stroke-dasharray="4 4"/>
  <text x="340" y="528" font-size="10.5" fill="#6F5A1E" font-weight="700">[unique index violation — another patient committed first]</text>
  <path d="M890 566 H415" class="ret"/><text x="430" y="560" class="msg-t" fill="#8E3B24">10b: IntegrityError → rollback → 409 slot_taken</text>

  <path d="M415 680 H165" class="ret"/>
  <text x="180" y="674" class="msg-t" fill="#66756F">11: success toast · or friendly conflict message (doctor + date kept)</text>

  <text x="500" y="770" text-anchor="middle" font-size="12" fill="#66756F">Same flow covers cancellation: PATCH /api/appointments/:id → CANCELLED releases the slot (partial index ignores cancelled rows).</text>

  <defs>
    <marker id="seq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#182521"/>
    </marker>
    <marker id="seq2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66756F"/>
    </marker>
  </defs>
</svg>
