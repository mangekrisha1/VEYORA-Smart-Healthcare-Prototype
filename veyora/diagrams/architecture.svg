<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Manrope, system-ui, sans-serif">
  <rect width="1100" height="720" fill="#F7F8F5"/>
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#182521">VEYORA — System Architecture (actual implementation)</text>

  <rect x="330" y="66" width="440" height="44" rx="12" fill="#E8F1EC" stroke="#096C60"/>
  <text x="550" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5D50">Actors (roles): Patient · Doctor · Project Manager</text>

  <rect x="300" y="150" width="500" height="84" rx="14" fill="#FFFFFF" stroke="#DEE5DF"/>
  <text x="316" y="176" font-size="14" font-weight="700" fill="#182521">React SPA (Vite + TypeScript)</text>
  <text x="316" y="198" font-size="12" fill="#66756F">Landing · Login · Patient views · Doctor view · PM workspace</text>
  <text x="316" y="218" font-size="12" fill="#66756F">Motion UI transitions — respects prefers-reduced-motion</text>

  <rect x="330" y="272" width="440" height="40" rx="10" fill="#F7F8F5" stroke="#DEE5DF"/>
  <text x="550" y="297" text-anchor="middle" font-size="12" fill="#182521">Vite dev proxy  /api → 127.0.0.1:5000  (same-origin cookies + CSRF)</text>

  <rect x="250" y="352" width="600" height="104" rx="14" fill="#FFFFFF" stroke="#096C60"/>
  <text x="266" y="378" font-size="14" font-weight="700" fill="#182521">Flask REST API (backend/app)</text>
  <text x="266" y="399" font-size="12" fill="#66756F">Auth: hashed passwords · server sessions (HttpOnly, SameSite=Lax) · CSRF token</text>
  <text x="266" y="418" font-size="12" fill="#66756F">RBAC per endpoint · Appointments · Health logs · Reminders</text>
  <text x="266" y="437" font-size="12" fill="#66756F">Risks · Tasks · Milestones · Verification · Plan</text>

  <rect x="60" y="362" width="160" height="84" rx="10" fill="#F7F8F5" stroke="#DEE5DF"/>
  <text x="140" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#182521">schedule.py</text>
  <text x="140" y="406" text-anchor="middle" font-size="11" fill="#66756F">weekly rosters, slots from</text>
  <text x="140" y="422" text-anchor="middle" font-size="11" fill="#66756F">runtime date (Asia/Kolkata)</text>

  <path d="M550 110 L550 150" stroke="#096C60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 234 L550 272" stroke="#096C60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 312 L550 352" stroke="#096C60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 456 L550 500" stroke="#096C60" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M220 404 L250 404" stroke="#66756F" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M830 520 L830 456" stroke="#66756F" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow2)"/>

  <ellipse cx="550" cy="505" rx="100" ry="14" fill="#FFFFFF" stroke="#096C60"/>
  <rect x="450" y="505" width="200" height="70" fill="#FFFFFF" stroke="#096C60"/>
  <ellipse cx="550" cy="575" rx="100" ry="14" fill="#FFFFFF" stroke="#096C60"/>
  <line x1="450" y1="505" x2="450" y2="575" stroke="#096C60"/>
  <line x1="650" y1="505" x2="650" y2="575" stroke="#096C60"/>
  <text x="550" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#182521">SQLAlchemy ORM · SQLite</text>
  <text x="550" y="556" text-anchor="middle" font-size="11" fill="#66756F">veyora.db · partial unique index uq_active_slot</text>

  <rect x="730" y="500" width="290" height="66" rx="10" fill="#F7F8F5" stroke="#DEE5DF"/>
  <text x="875" y="526" text-anchor="middle" font-size="12" font-weight="700" fill="#182521">pytest suite (42 tests, all passing)</text>
  <text x="875" y="546" text-anchor="middle" font-size="11" fill="#66756F">isolated file-backed DBs + live-server race test</text>

  <text x="550" y="640" text-anchor="middle" font-size="12" fill="#66756F">Out of scope (no components exist): video consults · prescriptions · payments · SMS/email/push ·</text>
  <text x="550" y="658" text-anchor="middle" font-size="12" fill="#66756F">AI diagnosis · offline sync · hospital integrations</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#096C60"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66756F"/>
    </marker>
  </defs>
</svg>
