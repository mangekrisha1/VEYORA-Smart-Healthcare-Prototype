<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Manrope, system-ui, sans-serif">
  <rect width="1300" height="820" fill="#F7F8F5"/>
  <text x="650" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#182521">VEYORA — ER Diagram (SQLite)</text>
  <style>
    .tbl { fill:#FFFFFF; stroke:#096C60; }
    .tbl-head { font-size:13px; font-weight:800; fill:#182521; }
    .tbl-body { font-size:11px; fill:#33413C; }
    .rel { stroke:#66756F; stroke-width:1.5; fill:none; }
    .rel-lbl { font-size:11px; fill:#66756F; font-weight:600; }
  </style>

  <rect x="70" y="80" width="280" height="170" class="tbl" fill="#E8F1EC"/>
  <text x="84" y="104" class="tbl-head">users</text>
  <line x1="70" y1="114" x2="350" y2="114" stroke="#096C60"/>
  <text x="84" y="132" class="tbl-body">PK  id</text>
  <text x="84" y="148" class="tbl-body">name · email UNIQUE · password_hash</text>
  <text x="84" y="164" class="tbl-body">role: PATIENT | DOCTOR | PROJECT_MANAGER</text>
  <text x="84" y="180" class="tbl-body">specialty (doctors only)</text>
  <text x="84" y="196" class="tbl-body">created_at (UTC)</text>

  <rect x="480" y="70" width="320" height="200" class="tbl"/>
  <text x="494" y="94" class="tbl-head">appointments</text>
  <line x1="480" y1="104" x2="800" y2="104" stroke="#096C60"/>
  <text x="494" y="122" class="tbl-body">PK  id</text>
  <text x="494" y="138" class="tbl-body">FK  patient_id → users.id</text>
  <text x="494" y="154" class="tbl-body">FK  doctor_id → users.id</text>
  <text x="494" y="170" class="tbl-body">date · start_time (IST wall clock)</text>
  <text x="494" y="186" class="tbl-body">status: CONFIRMED | COMPLETED | CANCELLED</text>
  <text x="494" y="202" class="tbl-body">created_at · updated_at (UTC)</text>
  <text x="494" y="224" class="tbl-body" font-weight="700">UNIQUE(doctor_id, date, start_time)</text>
  <text x="494" y="240" class="tbl-body" font-weight="700">WHERE status = 'CONFIRMED'  ← no double booking</text>

  <rect x="70" y="330" width="280" height="180" class="tbl"/>
  <text x="84" y="354" class="tbl-head">health_logs</text>
  <line x1="70" y1="364" x2="350" y2="364" stroke="#096C60"/>
  <text x="84" y="382" class="tbl-body">PK  id</text>
  <text x="84" y="398" class="tbl-body">FK  patient_id → users.id</text>
  <text x="84" y="414" class="tbl-body">type: HEART_RATE | TEMPERATURE | BP</text>
  <text x="84" y="430" class="tbl-body">value (bpm / °C)</text>
  <text x="84" y="446" class="tbl-body">systolic, diastolic (mmHg)</text>
  <text x="84" y="462" class="tbl-body">note · taken_at (UTC)</text>

  <rect x="480" y="330" width="320" height="110" class="tbl"/>
  <text x="494" y="354" class="tbl-head">reminder_reads</text>
  <line x1="480" y1="364" x2="800" y2="364" stroke="#096C60"/>
  <text x="494" y="382" class="tbl-body">PK  user_id → users.id</text>
  <text x="494" y="398" class="tbl-body">PK  appointment_id → appointments.id</text>
  <text x="494" y="414" class="tbl-body">read_at (UTC)</text>

  <rect x="920" y="70" width="310" height="190" class="tbl"/>
  <text x="934" y="94" class="tbl-head">risks</text>
  <line x1="920" y1="104" x2="1230" y2="104" stroke="#096C60"/>
  <text x="934" y="122" class="tbl-body">PK  id · code UNIQUE (RISK-01…)</text>
  <text x="934" y="138" class="tbl-body">title · description · category</text>
  <text x="934" y="154" class="tbl-body">probability 1–5 · impact 1–5 · score = P×I</text>
  <text x="934" y="170" class="tbl-body">owner · mitigation · contingency</text>
  <text x="934" y="186" class="tbl-body">status · control_status · review_date</text>
  <text x="934" y="202" class="tbl-body">linked_requirement / task / verification</text>

  <rect x="920" y="320" width="310" height="160" class="tbl"/>
  <text x="934" y="344" class="tbl-head">tasks</text>
  <line x1="920" y1="354" x2="1230" y2="354" stroke="#096C60"/>
  <text x="934" y="372" class="tbl-body">PK  id · title · description</text>
  <text x="934" y="388" class="tbl-body">status: TODO | IN_PROGRESS | DONE</text>
  <text x="934" y="404" class="tbl-body">priority · owner</text>
  <text x="934" y="420" class="tbl-body">FK  risk_id → risks.id</text>
  <text x="934" y="436" class="tbl-body">jira_key · jira_url</text>

  <rect x="480" y="530" width="320" height="100" class="tbl"/>
  <text x="494" y="554" class="tbl-head">milestones</text>
  <line x1="480" y1="564" x2="800" y2="564" stroke="#096C60"/>
  <text x="494" y="582" class="tbl-body">PK  id · title · due_date</text>
  <text x="494" y="598" class="tbl-body">status (Planned/In progress/Done) · notes</text>

  <rect x="920" y="540" width="310" height="170" class="tbl"/>
  <text x="934" y="564" class="tbl-head">verification_records</text>
  <line x1="920" y1="574" x2="1230" y2="574" stroke="#096C60"/>
  <text x="934" y="592" class="tbl-body">PK  id · req_id · req_text</text>
  <text x="934" y="608" class="tbl-body">risk_code · control · test_name · expected</text>
  <text x="934" y="624" class="tbl-body">result: PENDING | PASS | FAIL</text>
  <text x="934" y="640" class="tbl-body">kind: automated | manual</text>
  <text x="934" y="656" class="tbl-body">run_date · evidence_source</text>

  <path d="M350 130 H480" class="rel" marker-end="url(#a)"/>
  <text x="415" y="122" text-anchor="middle" class="rel-lbl">books (as patient)</text>
  <path d="M350 200 C 420 240, 420 240, 480 235" class="rel" marker-end="url(#a)"/>
  <text x="415" y="252" text-anchor="middle" class="rel-lbl">attends (as doctor)</text>
  <path d="M210 250 V330" class="rel" marker-end="url(#a)"/>
  <text x="222" y="296" class="rel-lbl">owns (1..n)</text>
  <path d="M640 270 V330" class="rel" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="652" y="306" class="rel-lbl">marks read</text>
  <path d="M1075 260 V320" class="rel" marker-end="url(#a)"/>
  <text x="1087" y="296" class="rel-lbl">mitigated by</text>
  <path d="M1075 480 V540" class="rel" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="1087" y="516" class="rel-lbl">risk_code (soft link)</text>

  <text x="650" y="760" text-anchor="middle" font-size="12" fill="#66756F">Reminders are computed live from CONFIRMED appointments — no stored reminder table (RISK-06 control).</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66756F"/>
    </marker>
  </defs>
</svg>
