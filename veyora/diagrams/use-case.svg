<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Manrope, system-ui, sans-serif">
  <rect width="1100" height="800" fill="#F7F8F5"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#182521">VEYORA — Use Case Diagram</text>

  <rect x="280" y="66" width="540" height="680" rx="18" fill="none" stroke="#096C60" stroke-width="1.5"/>
  <text x="550" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#096C60">VEYORA system</text>

  <!-- actors -->
  <g stroke="#182521" stroke-width="2" fill="none">
    <circle cx="140" cy="235" r="12"/><line x1="140" y1="247" x2="140" y2="285"/>
    <line x1="118" y1="260" x2="162" y2="260"/><line x1="140" y1="285" x2="124" y2="310"/><line x1="140" y1="285" x2="156" y2="310"/>
    <circle cx="960" cy="165" r="12"/><line x1="960" y1="177" x2="960" y2="215"/>
    <line x1="938" y1="190" x2="982" y2="190"/><line x1="960" y1="215" x2="944" y2="240"/><line x1="960" y1="215" x2="976" y2="240"/>
    <circle cx="960" cy="495" r="12"/><line x1="960" y1="507" x2="960" y2="545"/>
    <line x1="938" y1="520" x2="982" y2="520"/><line x1="960" y1="545" x2="944" y2="570"/><line x1="960" y1="545" x2="976" y2="570"/>
  </g>
  <text x="140" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#182521">Patient</text>
  <text x="960" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#182521">Doctor</text>
  <text x="960" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#182521">Project Manager</text>
  <text x="960" y="608" text-anchor="middle" font-size="11" fill="#66756F">(Krisha Mange)</text>

  <!-- use cases -->
  <g font-size="12" fill="#182521" text-anchor="middle">
    <ellipse cx="445" cy="128" rx="120" ry="30" fill="#E8F1EC" stroke="#096C60"/>
    <text x="445" y="124">Sign in / Sign out</text>
    <text x="445" y="140" font-size="10" fill="#66756F">(session, hashed password, CSRF)</text>

    <ellipse cx="445" cy="210" rx="120" ry="30" fill="#fff" stroke="#096C60"/>
    <text x="445" y="206">Book in-clinic appointment</text>
    <text x="445" y="222" font-size="10" fill="#66756F">doctor → date → slot → confirm</text>

    <ellipse cx="445" cy="285" rx="120" ry="26" fill="#fff" stroke="#096C60"/>
    <text x="445" y="289">Cancel own appointment</text>

    <ellipse cx="445" cy="362" rx="120" ry="32" fill="#fff" stroke="#096C60"/>
    <text x="445" y="358">Manage own health logs</text>
    <text x="445" y="374" font-size="10" fill="#66756F">HR · temp · BP</text>

    <ellipse cx="445" cy="445" rx="120" ry="30" fill="#fff" stroke="#096C60"/>
    <text x="445" y="441">View in-app reminders,</text>
    <text x="445" y="456">mark them read</text>

    <ellipse cx="700" cy="158" rx="105" ry="26" fill="#fff" stroke="#096C60"/>
    <text x="700" y="162">View own appointment list</text>

    <ellipse cx="700" cy="238" rx="105" ry="28" fill="#fff" stroke="#096C60"/>
    <text x="700" y="234">Mark COMPLETED /</text>
    <text x="700" y="249">CANCELLED</text>

    <ellipse cx="670" cy="415" rx="115" ry="26" fill="#fff" stroke="#096C60"/>
    <text x="670" y="419">Manage risk register + heatmap</text>

    <ellipse cx="670" cy="495" rx="115" ry="26" fill="#fff" stroke="#096C60"/>
    <text x="670" y="499">Manage plan, tasks, milestones</text>

    <ellipse cx="670" cy="580" rx="115" ry="30" fill="#fff" stroke="#096C60"/>
    <text x="670" y="576">Record real verification results</text>
    <text x="670" y="592" font-size="10" fill="#66756F">REQ → risk → control → test</text>

    <ellipse cx="670" cy="668" rx="115" ry="30" fill="#F7F8F5" stroke="#DEE5DF" stroke-dasharray="5 4"/>
    <text x="670" y="664">Maintain JIRA backlog &amp; evidence</text>
    <text x="670" y="680" font-size="10" fill="#66756F">(outside app, student action)</text>
  </g>

  <!-- associations -->
  <g stroke="#66756F" stroke-width="1.4" fill="none">
    <line x1="162" y1="240" x2="330" y2="135"/>
    <line x1="162" y1="255" x2="326" y2="212"/>
    <line x1="162" y1="270" x2="326" y2="283"/>
    <line x1="162" y1="285" x2="328" y2="355"/>
    <line x1="162" y1="300" x2="330" y2="438"/>
    <line x1="938" y1="180" x2="560" y2="130"/>
    <line x1="938" y1="195" x2="800" y2="162"/>
    <line x1="938" y1="215" x2="802" y2="235"/>
    <line x1="938" y1="505" x2="560" y2="138"/>
    <line x1="938" y1="515" x2="782" y2="420"/>
    <line x1="938" y1="525" x2="782" y2="495"/>
    <line x1="938" y1="540" x2="782" y2="577"/>
    <line x1="938" y1="560" x2="782" y2="660" stroke-dasharray="5 4"/>
  </g>
</svg>
